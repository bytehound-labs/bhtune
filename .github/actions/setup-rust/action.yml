name: Setup Rust
description: >
  Install the pinned stable Rust toolchain action, optionally restore the
  Swatinem Rust cache, and optionally install pinned taiki-e tools. An empty
  toolchain or components input is omitted rather than forwarded: the pinned
  toolchain action treats an explicit empty toolchain string as missing and
  fails, and its defaults apply only when the input is absent. Cache defaults
  to false so a job that does not already cache stays uncached. Tools are
  skipped when the list is empty. Cache runs before tools so a restored bin
  directory cannot hide a tool this job just installed. Jobs that need protoc
  pass it in tools; it is a build requirement wherever opcda-bridge-proto
  compiles bridge.proto.

inputs:
  toolchain:
    description: >
      Toolchain passed to dtolnay/rust-toolchain. Leave empty to omit the
      input and keep that action's default (stable). Pass an explicit version,
      such as 1.94.0, when a job must not float on stable.
    required: false
    default: ""
  components:
    description: >
      Comma-separated components passed to dtolnay/rust-toolchain. Leave empty
      to omit the input. Callers keep their existing spelling, including spaces.
    required: false
    default: ""
  cache:
    description: >
      Whether to run Swatinem/rust-cache. Defaults to false. Pass true only for
      jobs that already cache.
    required: false
    default: "false"
  tools:
    description: >
      Comma-separated tool list for taiki-e/install-action's tool input. Leave
      empty to skip tool installation. The list is forwarded unchanged.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Composite `uses` steps cannot omit an individual `with` key. Four
    # mutually exclusive steps keep an empty input absent instead of passing "".
    - name: Install Rust toolchain
      if: ${{ inputs.toolchain == '' && inputs.components == '' }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

    - name: Install Rust toolchain
      if: ${{ inputs.toolchain != '' && inputs.components == '' }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ inputs.toolchain }}

    - name: Install Rust toolchain
      if: ${{ inputs.toolchain == '' && inputs.components != '' }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        components: ${{ inputs.components }}

    - name: Install Rust toolchain
      if: ${{ inputs.toolchain != '' && inputs.components != '' }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Cache Rust build
      if: ${{ inputs.cache == 'true' }}
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

    - name: Install Rust tools
      if: ${{ inputs.tools != '' }}
      uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
      with:
        tool: ${{ inputs.tools }}
