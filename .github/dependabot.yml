version: 2
updates:
  # Cargo workspace: root Cargo.toml covers every crate under crates/*, since they all
  # share one Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Suppress routine version-update PRs; security updates remain enabled.
    open-pull-requests-limit: 0
    groups:
      # If routine updates are re-enabled, keep minor/patch changes grouped.
      cargo-routine-updates:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    labels:
      - dependencies
      - rust

  # pnpm workspace root: covers both the root package.json and frontend/package.json,
  # since they share one pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Suppress routine version-update PRs; security updates remain enabled.
    open-pull-requests-limit: 0
    groups:
      # If routine updates are re-enabled, keep minor/patch changes grouped.
      npm-routine-updates:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    labels:
      - dependencies
      - frontend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Suppress routine version-update PRs; security updates remain enabled.
    open-pull-requests-limit: 0
    groups:
      # If routine updates are re-enabled, keep minor/patch changes grouped.
      github-actions-routine-updates:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
