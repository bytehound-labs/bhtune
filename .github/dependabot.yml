version: 2
updates:
  # Cargo workspace: root Cargo.toml covers every crate under crates/*, since they all
  # share one Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep routine updates low-noise; major upgrades stay as focused PRs.
      cargo-routine-updates:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    labels:
      - dependencies
      - rust

  # pnpm workspace root: covers both the root package.json and frontend/package.json,
  # since they share one pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep routine updates low-noise; major upgrades stay as focused PRs.
      npm-routine-updates:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    labels:
      - dependencies
      - frontend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep routine updates low-noise; major upgrades stay as focused PRs.
      github-actions-routine-updates:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
