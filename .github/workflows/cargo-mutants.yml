name: Cargo Mutants

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to mutate
        required: true
        default: all
        type: choice
        options:
          - all
          - bhtune-core
          - bhtune-driver
          - bhtune-db
          - bhtune-cli
          - bhtune-server
  schedule:
    - cron: "17 2 * * 6"

concurrency:
  group: cargo-mutants-${{ github.ref }}-${{ inputs.package || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    name: Select mutation packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - name: Resolve package selector
        id: packages
        env:
          PACKAGE: ${{ inputs.package || 'all' }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            all)
              matrix='{"package":["bhtune-core","bhtune-driver","bhtune-db","bhtune-cli","bhtune-server"]}'
              ;;
            bhtune-core|bhtune-driver|bhtune-db|bhtune-cli|bhtune-server)
              matrix="{\"package\":[\"$PACKAGE\"]}"
              ;;
            *)
              echo "::error::Unsupported package selector: $PACKAGE"
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mutate:
    name: Mutation testing (${{ matrix.package }})
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-mutants@27.1.0,protoc

      - name: Run cargo-mutants
        run: cargo mutants --package "${{ matrix.package }}" --in-place --no-shuffle --timeout 180

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cargo-mutants-${{ matrix.package }}-${{ github.run_id }}
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14
