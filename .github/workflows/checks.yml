name: Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect validation changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      website: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.website == 'true' }}
      package: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.package == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'LICENSE'
              - 'deny.toml'
              - 'release-plz.toml'
              - 'openapi.json'
              - '.cargo/**'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'crates/**/*.rs'
              - 'crates/**/build.rs'
              - 'crates/**/Cargo.toml'
              - 'crates/**/proto/**'
            frontend:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'openapi.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
              - 'frontend/**'
            website:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
              - 'docs/**'
              - 'website/**'
            package:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'LICENSE'
              - 'README.md'
              - '.github/workflows/**'
              - 'crates/**/Cargo.toml'
              - 'crates/**/README.md'
              - 'crates/**/LICENSE'
              - 'crates/**/CHANGELOG.md'
              - 'packaging/**'
              - 'scripts/**'

  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-deny,cargo-machete,protoc

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run cargo-deny
        run: cargo deny check

      - name: Check for unused dependencies
        run: cargo machete

      - name: Regenerate OpenAPI spec and check for drift
        run: |
          cargo run --locked -p bhtune-server --example gen_openapi
          git diff --exit-code openapi.json

      - name: Check OpenAPI compatibility comparator
        run: python3 scripts/check_openapi_breaking_test.py

      - name: Fetch base OpenAPI spec
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show "origin/$BASE_REF:openapi.json" > /tmp/openapi-base.json

      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_openapi_breaking.py /tmp/openapi-base.json openapi.json

      - name: Regenerate CLI docs and check for drift
        run: |
          cargo run --locked -p bhtune-cli --example gen_docs --features schemars
          git diff --exit-code -- docs/reference/ man/ completions/

      - name: Build workspace
        run: cargo build --workspace --locked

  windows:
    name: Windows validation
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-deny,cargo-machete,protoc

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  package:
    name: Package verification
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: protoc

      - name: Verify publishable packages
        run: cargo package --workspace --locked

  msrv:
    name: MSRV
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@35d8a35b823d6c20db516f5c35eb0a9640942c17

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: protoc

      - name: Check the declared MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@lts
          cache: true

      - name: Check npm dependency licenses
        run: pnpm run check:licenses

      - name: Regenerate OpenAPI TS types and check for drift
        run: |
          pnpm --filter bhtune-frontend run generate:api
          git diff --exit-code -- frontend/src/api/schema.d.ts

      - name: Check formatting
        run: pnpm --filter bhtune-frontend run format:check

      - name: Lint
        run: pnpm --filter bhtune-frontend run lint

      - name: Build (typecheck + bundle)
        run: pnpm --filter bhtune-frontend run build

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@lts
          cache: true

      - name: Check formatting
        run: pnpm --filter bhtune-website run format:check

      - name: Lint
        run: pnpm --filter bhtune-website run lint

      - name: Typecheck
        run: pnpm --filter bhtune-website run typecheck

      - name: Build (also a broken-link/anchor drift gate for docs/)
        run: pnpm --filter bhtune-website run build

  status:
    name: Required validation status
    if: always()
    needs: [changes, check, windows, package, msrv, frontend, website]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if change detection failed
        if: needs.changes.result != 'success'
        run: |
          echo "Change detection did not complete successfully."
          exit 1

      - name: Report skipped validation
        if: >-
          needs.changes.outputs.rust != 'true' &&
          needs.changes.outputs.frontend != 'true' &&
          needs.changes.outputs.website != 'true' &&
          needs.changes.outputs.package != 'true'
        run: echo "No validation-affecting files changed; heavy validation skipped."

      - name: Verify validation results
        env:
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          WEBSITE_CHANGED: ${{ needs.changes.outputs.website }}
          PACKAGE_CHANGED: ${{ needs.changes.outputs.package }}
          CHECK_RESULT: ${{ needs.check.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          failed=0

          if [[ "$RUST_CHANGED" == "true" ]]; then
            for result in "$CHECK_RESULT" "$WINDOWS_RESULT" "$MSRV_RESULT"; do
              if [[ "$result" != "success" ]]; then
                echo "A required Rust validation job ended with: $result"
                failed=1
              fi
            done
          fi

          if [[ "$FRONTEND_CHANGED" == "true" && "$FRONTEND_RESULT" != "success" ]]; then
            echo "Frontend validation ended with: $FRONTEND_RESULT"
            failed=1
          fi

          if [[ "$WEBSITE_CHANGED" == "true" && "$WEBSITE_RESULT" != "success" ]]; then
            echo "Website validation ended with: $WEBSITE_RESULT"
            failed=1
          fi

          if [[ "$PACKAGE_CHANGED" == "true" && "$PACKAGE_RESULT" != "success" ]]; then
            echo "Package verification ended with: $PACKAGE_RESULT"
            failed=1
          fi

          exit "$failed"
