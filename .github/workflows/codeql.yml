name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          languages: rust,javascript-typescript
          build-mode: none

      - uses: ./.github/actions/setup-rust
        with:
          cache: true
          tools: protoc

      - name: Build Rust targets for CodeQL
        run: cargo build --workspace --locked

      - uses: ./.github/actions/setup-pnpm
        with:
          runtime: node@lts
          cache: true

      - name: Build JavaScript and TypeScript targets for CodeQL
        run: pnpm --filter bhtune-frontend run build

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
