name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85
        with:
          languages: rust,javascript-typescript
          build-mode: manual

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: protoc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Build Rust targets for CodeQL
        run: cargo build --workspace --locked

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@lts
          cache: true

      - name: Build JavaScript and TypeScript targets for CodeQL
        run: pnpm --filter bhtune-frontend run build

      - uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85
