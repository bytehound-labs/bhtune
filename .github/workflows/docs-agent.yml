name: Docs agent

# Tier 2 of the documentation contract (see AGENTS.md "Documentation contract"): this workflow
# handles narrative prose and coordinates the generated Web UI screenshot lock. Tier 1
# (docs/reference/**, the OpenAPI spec, man pages, completions) is mechanically generated and
# already diff-gated by checks.yml. AGENTS.md is explicitly off limits -- this workflow may
# never auto-commit to it.
#
# It runs the deterministic screenshot capture before GitHub Copilot CLI, then auto-commits
# narrative updates and screenshot metadata together on same-repository PRs. Screenshot PNGs
# remain generated-only review artifacts; the agent never edits their lock by hand. Every
# guardrail below is load-bearing -- read the comment before changing it. See the
# `docs-agent-ci` entry in AGENTS.md for the full design rationale.

on:
  pull_request:
    paths:
      - "crates/**"
      - "frontend/src/**"
      - "frontend/e2e/docs-screenshots/**"
      - "frontend/playwright.docs.config.ts"
      - "scripts/web-ui-screenshots.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          PR number to run the docs agent against. For fork PRs only -- a maintainer must have
          already read the diff, since fork PRs never get repo secrets automatically (see
          GUARDRAIL 4 below).
        required: true

concurrency:
  group: docs-agent-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap, always-runs gate that decides whether the real job should do anything at all.
  # Kept separate from docs-agent so the loop-prevention check in GUARDRAIL 1 happens before
  # any Copilot CLI install/invocation, even on the (expected, frequent) skip path.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether to run
        id: decide
        run: |
          # GUARDRAIL 1 (infinite loop): the agent's own commits carry a distinct git author
          # identity (set in the "Run docs agent" step below). Detect that identity on HEAD and
          # skip if it's already there.
          #
          # This can't be done with `github.actor` instead: the agent pushes using
          # COPILOT_GITHUB_TOKEN, a personal PAT, so GitHub attributes that push to its human
          # owner, not to a distinct bot identity -- indistinguishable from that person pushing
          # themselves. The git commit author (independent of which token performed the push)
          # is the only reliable signal here. The path filter above is a second, structural
          # line of defense: the workflow-owned commit only touches docs/README.md and the
          # generated screenshot lock, none of which matches the implementation paths above,
          # so its own push does not normally retrigger this workflow -- but don't rely on that
          # alone.
          author_email="$(git log -1 --pretty=format:'%ae')"
          if [ "$author_email" = "bhtune-docs-agent@users.noreply.github.com" ]; then
            echo "Last commit was made by the docs agent itself -- skipping to avoid a loop."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  docs-agent:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check for Copilot token
        id: token-check
        run: |
          # GUARDRAIL 4 (fork PRs): `pull_request` runs from forks never receive repo secrets,
          # so COPILOT_GITHUB_TOKEN is empty here and this job skips itself -- the safe
          # default. Do NOT "fix" this with `pull_request_target`; that trigger runs with
          # write permissions in the context of the fork's (untrusted) code, a known
          # privilege-escalation foot-gun. Outside contributions instead get the
          # `workflow_dispatch` path above, run manually by a maintainer who already read the
          # diff.
          if [ -z "${{ secrets.COPILOT_GITHUB_TOKEN }}" ]; then
            echo "COPILOT_GITHUB_TOKEN is not set (expected on fork PRs) -- skipping."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]
        with:
          ref: ${{ needs.guard.outputs.ref }}
          # COPILOT_GITHUB_TOKEN authenticates Copilot CLI, but is not necessarily a GitHub
          # repository token. Use the workflow token for checkout/push, whose permissions are
          # declared on this job.
          token: ${{ github.token }}

      # Screenshot capture is deliberately before the token-gated Copilot steps. Fork PRs do
      # not receive COPILOT_GITHUB_TOKEN, but they can still receive a deterministic candidate
      # gallery and a stale-lock report without any repository secret.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: protoc

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@lts
          cache: true

      - name: Build frontend
        run: pnpm --filter bhtune-frontend run build

      - name: Build bhtune-server
        run: cargo build --locked -p bhtune-server

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate candidate screenshots and lock metadata
        run: pnpm docs:screenshots

      - name: Upload Web UI screenshot review gallery
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-ui-screenshot-review
          path: |
            frontend/test-results/docs-screenshots/
            website/static/generated/web-ui/
            docs/reference/web-ui-screenshots.json
          if-no-files-found: warn
          retention-days: 7

      - name: Save generated screenshot lock
        run: cp docs/reference/web-ui-screenshots.json /tmp/web-ui-screenshots.generated.json

      - name: Install GitHub Copilot CLI
        if: steps.token-check.outputs.has_token == 'true'
        run: npm install -g @github/copilot@1.0.80 # zizmor: ignore[adhoc-packages]

      - name: Run docs agent
        if: steps.token-check.outputs.has_token == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          git config user.name "bhtune-docs-agent"
          git config user.email "bhtune-docs-agent@users.noreply.github.com"
          git fetch origin main --depth=1
          copilot -p "$(cat .github/docs-agent-prompt.md)" \
            --allow-all-tools \
            --deny-tool 'write(AGENTS.md)' \
            --no-ask-user \
            --model claude-sonnet-4.5 \
            --secret-env-vars COPILOT_GITHUB_TOKEN \
            --silent \
            | tee /tmp/docs-agent-output.txt
          # GUARDRAIL 5 (COST): the path filter above already keeps this from running on every
          # PR; --model is pinned rather than left on auto-routing so a model upgrade never
          # silently changes behavior/cost on every future PR without a reviewed change here.

      - name: Enforce blast radius
        run: |
          # GUARDRAIL 2 (blast radius): screenshot generation may update only the one
          # workflow-owned lock plus narrative docs. The Copilot agent itself is still told to
          # edit only narrative docs/README.md, and the generated lock is compared byte-for-byte
          # below so it cannot be hand-edited. A wrong-but-plausible edit to source code is far
          # more damaging than a wrong paragraph, so any other touched path -- including
          # AGENTS.md, belt-and-suspenders alongside the --deny-tool above -- fails the job and
          # discards every change.
          changed="$(git status --porcelain=v1 | awk '{print $2}')"
          bad=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/reference/web-ui-screenshots.json) ;;
              docs/*) ;;
              README.md) ;;
              *) bad="$bad$f"$'\n' ;;
            esac
          done <<< "$changed"
          if [ -n "$bad" ]; then
            echo "::error::Docs agent touched disallowed paths -- discarding all its changes:"
            echo "$bad"
            git checkout -- .
            git clean -fd
            exit 1
          fi

      - name: Protect generated screenshot lock
        if: steps.token-check.outputs.has_token == 'true'
        run: |
          if ! cmp -s docs/reference/web-ui-screenshots.json /tmp/web-ui-screenshots.generated.json; then
            echo "::error::The docs agent modified the generated Web UI screenshot lock."
            git checkout -- docs/reference/web-ui-screenshots.json
            exit 1
          fi

      - name: Report fork screenshot drift
        if: steps.token-check.outputs.has_token != 'true'
        run: |
          if ! git diff --quiet -- docs/reference/web-ui-screenshots.json; then
            echo "::warning::Generated Web UI screenshot metadata differs from the fork PR."
            echo "The candidate gallery is available as the web-ui-screenshot-review artifact."
          fi

      - name: Commit and push
        if: steps.token-check.outputs.has_token == 'true'
        env:
          # Passed as env vars rather than interpolated directly into the script: a PR branch
          # name is attacker-controlled (the PR author picks it) and git ref names permit shell
          # metacharacters like `$()` or backticks, so splicing it into the script text
          # directly would be a script-injection vector. A shell variable expansion at runtime
          # is safe; a template-level substitution before the shell ever sees the script is not.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No doc changes -- nothing to commit."
            exit 0
          fi
          git add docs README.md
          git commit -m "docs: sync prose with recent code changes (automated)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Fork PR: can't push to a branch that lives in the fork. Land the commit on a new
            # branch in this repo instead and let the maintainer who triggered this take it
            # from there (cherry-pick onto the fork PR, or open a follow-up PR).
            branch="docs-agent/pr-${PR_NUMBER}-followup"
            git push origin "HEAD:refs/heads/$branch"
            echo "Pushed doc updates to $branch (fork PR #${PR_NUMBER} can't be pushed to directly)."
          else
            git push origin "HEAD:$HEAD_REF"
          fi

      - name: Post summary comment
        if: steps.token-check.outputs.has_token == 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          # GUARDRAIL 3 (AGENTS.md): the agent is told (and --deny-tool enforced) to never
          # edit AGENTS.md, only to describe a proposed change in its final response instead.
          # Posting that response here is what actually surfaces the proposal for human review.
          if [ -s /tmp/docs-agent-output.txt ]; then
            { echo "**Docs agent:**"; echo; cat /tmp/docs-agent-output.txt; } | \
              gh pr comment "$PR_NUMBER" --body-file - || true
          fi
