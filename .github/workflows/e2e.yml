name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect E2E changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            e2e:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
              - 'crates/**/*.rs'
              - 'crates/**/build.rs'
              - 'crates/**/Cargo.toml'
              - 'crates/**/proto/**'
              - 'frontend/**'

  e2e_run:
    name: Playwright E2E (${{ matrix.mode }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [full, demo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # `bhtune-driver`'s bridge dependency compiles protobuf code even though this E2E
      # exercises the simulator driver, so protoc remains a build requirement.
      - uses: ./.github/actions/setup-rust
        with:
          cache: true
          tools: protoc

      - name: Build bhtune-server
        run: cargo build -p bhtune-server --locked

      - uses: ./.github/actions/setup-pnpm
        with:
          runtime: node@lts
          cache: true

      - name: Build frontend
        run: pnpm --filter bhtune-frontend run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        env:
          PLAYWRIGHT_MODE: ${{ matrix.mode }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/frontend/playwright-report/${{ matrix.mode }}
        run: pnpm --filter bhtune-frontend exec playwright test --project=${{ matrix.mode }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-${{ matrix.mode }}
          path: frontend/playwright-report/${{ matrix.mode }}/
          retention-days: 7

  e2e:
    name: Required E2E status
    if: always()
    needs: [changes, e2e_run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if change detection failed
        if: needs.changes.result != 'success'
        run: |
          echo "Change detection did not complete successfully."
          exit 1

      - name: Report skipped E2E
        if: needs.changes.outputs.run != 'true'
        run: echo "No E2E-affecting files changed; browser validation skipped."

      - name: Verify E2E result
        if: needs.changes.outputs.run == 'true' && needs.e2e_run.result != 'success'
        run: |
          echo "E2E ended with: ${{ needs.e2e_run.result }}"
          exit 1
