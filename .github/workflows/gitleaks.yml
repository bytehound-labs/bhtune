name: Gitleaks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/gitleaks.yml"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/gitleaks.yml"
  schedule:
    - cron: "11 3 * * 1"

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.28.0

      - name: Scan repository history
        run: |
          "$(go env GOPATH)/bin/gitleaks" detect \
            --source . \
            --log-opts="--all" \
            --redact \
            --verbose
