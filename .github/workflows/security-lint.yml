name: Workflow security lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/zizmor.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/zizmor.yml"
  schedule:
    - cron: "59 3 * * 1"

concurrency:
  group: workflow-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check workflow syntax with actionlint
        run: actionlint

      - name: Install zizmor
        run: |
          python3 -m venv /tmp/zizmor-venv
          /tmp/zizmor-venv/bin/pip install --disable-pip-version-check --no-cache-dir "zizmor==1.29.0"

      - name: Audit workflows with zizmor
        run: /tmp/zizmor-venv/bin/zizmor .github/workflows/*.yml
