name: Windows Installer

on:
  workflow_call:
    inputs:
      mode:
        description: "dry-run builds from source; release consumes an exact stable release asset"
        required: false
        type: string
        default: dry-run
      source_ref:
        description: "Git ref to build for dry-run mode"
        required: false
        type: string
        default: main
      release_tag:
        description: "Exact stable tag to consume in release mode"
        required: false
        type: string
        default: ""
      attest:
        description: "Create keyless Sigstore and GitHub provenance evidence (stable release mode only)"
        required: false
        type: boolean
        default: false
    outputs:
      installer_name:
        description: "Generated installer filename"
        value: ${{ jobs.build.outputs.installer_name }}
      installer_sha256:
        description: "Generated installer SHA-256"
        value: ${{ jobs.build.outputs.installer_sha256 }}
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run builds from source; release consumes an exact stable release asset"
        required: true
        type: choice
        options:
          - dry-run
          - release
        default: dry-run
      source_ref:
        description: "Git ref to build for dry-run mode"
        required: false
        type: string
        default: main
      release_tag:
        description: "Exact stable tag to consume in release mode"
        required: false
        type: string
        default: ""
      attest:
        description: "Create keyless Sigstore and GitHub provenance evidence (stable release mode only)"
        required: true
        type: boolean
        default: false

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and validate NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      installer_name: ${{ steps.outputs.outputs.installer_name }}
      installer_sha256: ${{ steps.outputs.outputs.installer_sha256 }}
      installer_artifact_name: ${{ steps.outputs.outputs.installer_artifact_name }}
    steps:
      - name: Validate workflow inputs
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ATTEST: ${{ inputs.attest }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MODE -notin @('dry-run', 'release')) {
            throw "mode must be either dry-run or release"
          }
          if ($env:MODE -eq 'release') {
            if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "release mode requires an exact stable tag matching vX.Y.Z"
            }
          } elseif (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw "release_tag is only valid in release mode"
          }
          if ($env:MODE -eq 'dry-run' -and $env:ATTEST -eq 'true') {
            throw "attest=true is only valid in stable release mode"
          }
          if ($env:MODE -eq 'release' -and $env:ATTEST -ne 'true') {
            throw "release mode requires attest=true"
          }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.mode == 'release' && inputs.release_tag || inputs.source_ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: protoc

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@lts
          cache: true

      - name: Install and verify NSIS 3.12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --version=3.12.0 --yes --no-progress
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) {
            throw "NSIS 3.12.0 was not installed at $makensis"
          }
          $version = (& $makensis /VERSION 2>&1 | Out-String).Trim()
          if ($version -notmatch '3\.12') {
            throw "Expected NSIS 3.12, got: $version"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $makensis)

      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object { $_.name -eq 'bhtune-cli' })[0]
          if ($null -eq $package) {
            throw 'bhtune-cli package was not found in cargo metadata'
          }
          $workspaceVersion = [string]$package.version
          if ($env:MODE -eq 'release') {
            $tagVersion = $env:RELEASE_TAG.Substring(1)
            if ($workspaceVersion -ne $tagVersion) {
              throw "stable tag $env:RELEASE_TAG does not match workspace version $workspaceVersion"
            }
            $version = $tagVersion
          } else {
            $version = $workspaceVersion
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "the Windows installer requires a stable X.Y.Z package version, got: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Cosign for stable-release verification
        if: inputs.mode == 'release'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: Prepare release payload
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:GITHUB_WORKSPACE 'installer-build\payload'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          if ($env:MODE -eq 'release') {
            $download = Join-Path $env:GITHUB_WORKSPACE 'installer-build\release'
            New-Item -ItemType Directory -Force -Path $download | Out-Null
            $archiveName = "bhtune-$($env:RELEASE_TAG)-x86_64-pc-windows-msvc.zip"
            gh release download $env:RELEASE_TAG `
              --repo $env:REPOSITORY `
              --dir $download `
              --pattern $archiveName `
              --pattern "$archiveName.sigstore.json" `
              --pattern "release-assets.sha256" `
              --pattern "release-provenance.bundle.json"
            if ($LASTEXITCODE -ne 0) {
              throw "gh release download failed with exit code $LASTEXITCODE"
            }

            $archive = Get-Item -LiteralPath (Join-Path $download $archiveName) -ErrorAction SilentlyContinue
            $archiveBundle = Get-Item -LiteralPath (Join-Path $download "$archiveName.sigstore.json") -ErrorAction SilentlyContinue
            $checksum = Get-Item -LiteralPath (Join-Path $download 'release-assets.sha256') -ErrorAction SilentlyContinue
            $provenance = Get-Item -LiteralPath (Join-Path $download 'release-provenance.bundle.json') -ErrorAction SilentlyContinue
            if ($null -eq $archive -or $null -eq $archiveBundle -or $null -eq $checksum -or $null -eq $provenance) {
              throw 'the stable release did not contain the Windows archive, archive signature, checksum, and provenance bundle'
            }

            gh attestation verify $checksum.FullName `
              --repo $env:REPOSITORY `
              --bundle $provenance.FullName `
              --signer-workflow "$env:REPOSITORY/.github/workflows/release.yml" `
              --source-ref "refs/tags/$env:RELEASE_TAG" `
              --cert-oidc-issuer 'https://token.actions.githubusercontent.com'
            if ($LASTEXITCODE -ne 0) {
              throw "gh attestation verify failed with exit code $LASTEXITCODE"
            }

            $releaseIdentity = "https://github.com/$env:REPOSITORY/.github/workflows/release.yml@refs/tags/$env:RELEASE_TAG"
            cosign verify-blob `
              --bundle $archiveBundle.FullName `
              --certificate-identity $releaseIdentity `
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' `
              $archive.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "cosign verify-blob failed with exit code $LASTEXITCODE"
            }

            $line = Get-Content -LiteralPath $checksum.FullName |
              Where-Object { $_ -match ('\s' + [regex]::Escape($archive.Name) + '$') } |
              Select-Object -First 1
            $checksumMatch = if ($null -eq $line) {
              $null
            } else {
              [regex]::Match(
                [string]$line,
                '^(?<hash>[0-9a-fA-F]{64})\s+\*?(?<name>.+)$'
              )
            }
            if ($null -eq $checksumMatch -or -not $checksumMatch.Success -or
                $checksumMatch.Groups['name'].Value -ne $archive.Name) {
              throw "could not parse checksum line for $($archive.Name)"
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash
            if ($actual -ne $checksumMatch.Groups['hash'].Value.ToUpperInvariant()) {
              throw "release archive checksum mismatch for $($archive.Name)"
            }
            $extract = Join-Path $download 'extract'
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract -Force
            $sourcePayload = Get-ChildItem -LiteralPath $extract -Recurse -Directory |
              Where-Object { Test-Path (Join-Path $_.FullName 'bhtune.exe') } |
              Select-Object -First 1
            if ($null -eq $sourcePayload) {
              $sourcePayload = Get-Item -LiteralPath $extract
            }
            Copy-Item -LiteralPath (Join-Path $sourcePayload.FullName 'bhtune.exe') -Destination $payload
            Copy-Item -LiteralPath (Join-Path $sourcePayload.FullName 'bhtune-server.exe') -Destination $payload
            Copy-Item -LiteralPath (Join-Path $sourcePayload.FullName 'LICENSE') -Destination $payload
            Copy-Item -LiteralPath (Join-Path $sourcePayload.FullName 'README.md') -Destination $payload
          } else {
            pnpm --filter bhtune-frontend run build
            cargo build --release --locked -p bhtune-cli -p bhtune-server
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'target\release\bhtune.exe') -Destination $payload
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'target\release\bhtune-server.exe') -Destination $payload
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') -Destination $payload
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'README.md') -Destination $payload
          }

          foreach ($binary in @('bhtune.exe', 'bhtune-server.exe')) {
            $path = Join-Path $payload $binary
            if (-not (Test-Path -LiteralPath $path)) {
              throw "payload is missing $binary"
            }
            $output = (& $path --version 2>&1 | Out-String)
            if ($output -notmatch [regex]::Escape($env:PACKAGE_VERSION)) {
              throw "$binary does not report package version $env:PACKAGE_VERSION`: $output"
            }
          }
          foreach ($file in @('LICENSE', 'README.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $payload $file))) {
              throw "payload is missing $file"
            }
          }
          "PAYLOAD=$payload" >> $env:GITHUB_ENV

      - name: Run installer contract self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'installer\windows\tests\Test-InstallerSupport.ps1')

      - name: Parse installer PowerShell sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            (Join-Path $env:GITHUB_WORKSPACE 'installer\windows\InstallerSupport.ps1'),
            (Join-Path $env:GITHUB_WORKSPACE 'installer\windows\Install-Bhtune.ps1'),
            (Join-Path $env:GITHUB_WORKSPACE 'installer\windows\tests\Test-InstallerSupport.ps1'),
            (Join-Path $env:GITHUB_WORKSPACE 'installer\windows\tests\Run-NsisDiagnostic.ps1')
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "installer source is missing: $file"
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parser rejected $file`: $($errors | Out-String)"
            }
          }

      - name: Build NSIS installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'installer-build\output'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $releaseTag = if ($env:MODE -eq 'release') {
            $env:RELEASE_TAG
          } else {
            # Dry runs build from a source checkout rather than a release tag.
            # Use the stable-shaped tag that the normal installer contract
            # requires while keeping release mode tied to the real tag.
            "v$($env:PACKAGE_VERSION)"
          }
          & $makensis `
            "/DPRODUCT_VERSION=$env:PACKAGE_VERSION" `
            "/DRELEASE_TAG=$releaseTag" `
            "/DPAYLOAD_DIR=$env:PAYLOAD" `
            "/DOUTPUT_DIR=$output" `
            (Join-Path $env:GITHUB_WORKSPACE 'installer\windows\bhtune-installer.nsi')
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }
          $installer = Get-ChildItem -LiteralPath $output -Filter '*.exe' -File |
            Where-Object { $_.Name -notlike 'Uninstall*' } |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw 'NSIS did not produce an installer executable'
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath (Join-Path $output "$($installer.Name).sha256") -Encoding ASCII
          "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV
          "CHECKSUM_PATH=$(Join-Path $output "$($installer.Name).sha256")" >> $env:GITHUB_ENV

      - name: Run silent NSIS lifecycle diagnostic
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:GITHUB_WORKSPACE 'installer\windows\tests\Run-NsisDiagnostic.ps1'
          $log = Join-Path $env:GITHUB_WORKSPACE 'installer-build\output\nsis-diagnostic.log'
          & $diagnostic `
            -InstallerPath $env:INSTALLER_PATH `
            -LogPath $log `
            -ExpectedVersion $env:PACKAGE_VERSION `
            -TimeoutSeconds 120
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS lifecycle diagnostic failed with exit code $LASTEXITCODE"
          }

      - name: Upload NSIS lifecycle diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bhtune-windows-installer-lifecycle-${{ steps.version.outputs.version }}
          path: installer-build/output/nsis-diagnostic.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bhtune-windows-installer-${{ steps.version.outputs.version }}
          path: |
            installer-build/output/*.exe
            installer-build/output/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Export reusable outputs
        id: outputs
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          "installer_name=$(Split-Path -Leaf $env:INSTALLER_PATH)" >> $env:GITHUB_OUTPUT
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:INSTALLER_PATH).Hash.ToLowerInvariant()
          "installer_sha256=$hash" >> $env:GITHUB_OUTPUT
          "installer_artifact_name=bhtune-windows-installer-$env:PACKAGE_VERSION" >> $env:GITHUB_OUTPUT

  release-evidence:
    name: Sign and attest stable installer
    needs: build
    if: inputs.mode == 'release' && inputs.attest == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: ${{ needs.build.outputs.installer_artifact_name }}
          path: installer-build/output

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: Sign installer with Sigstore
        shell: bash
        env:
          INSTALLER_NAME: ${{ needs.build.outputs.installer_name }}
        run: |
          set -euo pipefail
          installer="installer-build/output/${INSTALLER_NAME}"
          test -f "$installer"
          cosign sign-blob --yes \
            --bundle "${installer}.sigstore.json" \
            "$installer"

      - name: Attest installer provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-checksums: installer-build/output/${{ needs.build.outputs.installer_name }}.sha256

      - name: Save provenance bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" installer-build/output/installer.provenance.bundle.json

      - name: Upload installer evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bhtune-windows-installer-evidence-${{ needs.build.outputs.installer_name }}
          path: |
            installer-build/output/*.sigstore.json
            installer-build/output/installer.provenance.bundle.json
          if-no-files-found: error
          retention-days: 14
