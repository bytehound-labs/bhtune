skip_clone: true

concurrency:
  limit: 1

when:
  - event: push
    branch: main
    path:
      include:
        - ".dockerignore"
        - ".github/workflows/docker-publish.yml"
        - "Cargo.lock"
        - "Cargo.toml"
        - "Dockerfile"
        - "crates/**"
        - "frontend/**"
        - "package.json"
        - "pnpm-lock.yaml"
        - "pnpm-workspace.yaml"
        - ".woodpecker.yml"

steps:
  deploy:
    image: alpine:3.20.3
    environment:
      BHTUNE_GITHUB_TOKEN:
        from_secret: BHTUNE_GITHUB_TOKEN
      BHTUNE_APP1_SSH_PRIVATE_KEY:
        from_secret: APP1_SSH_PRIVATE_KEY
      BHTUNE_APP1_KNOWN_HOSTS:
        from_secret: BHTUNE_APP1_KNOWN_HOSTS
    commands:
      - apk add --no-cache bash ca-certificates curl jq openssh-client
      - |
        bash -euo pipefail <<'SCRIPT'
        image_repo='ghcr.io/bytehound-labs/bhtune'
        expected_sha="$CI_COMMIT_SHA"
        expected_repo='bytehound-labs/bhtune'
        expected_ref='refs/heads/main'
        expected_workflow='https://github.com/bytehound-labs/bhtune/.github/workflows/docker-publish.yml@refs/heads/main'
        gh_version='2.100.0'
        gh_archive="gh_"$gh_version"_linux_amd64.tar.gz"
        gh_sha256='e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be'

        if ! printf '%s\n' "$expected_sha" | grep -Eq '^[0-9a-f]{40}$'; then
          printf 'error: CI_COMMIT_SHA is not a full lowercase commit SHA\n' >&2
          exit 1
        fi

        image_tag="sha-$expected_sha"
        registry_token="$(curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
          "https://ghcr.io/token?service=ghcr.io&scope=repository:bytehound-labs/bhtune:pull" |
          jq -er '.token')"
        work_dir="$(mktemp -d)"
        trap 'rm -rf "$work_dir"' EXIT
        gh_archive_path="$work_dir/$gh_archive"
        curl -fsSL --retry 3 --connect-timeout 10 --max-time 60 \
          "https://github.com/cli/cli/releases/download/v"$gh_version"/"$gh_archive \
          -o "$gh_archive_path"
        printf '%s  %s\n' "$gh_sha256" "$gh_archive_path" | sha256sum -c -
        tar -xzf "$gh_archive_path" -C "$work_dir"
        gh_bin="$work_dir/gh_"$gh_version"_linux_amd64/bin/gh"
        test -x "$gh_bin"
        printf 'Using pinned GitHub CLI:\n'
        "$gh_bin" version
        registry_curl_config="$work_dir/registry-curl.conf"
        printf 'header = "%s: %s %s"\n' 'Authorization' 'Bearer' "$registry_token" \
          > "$registry_curl_config"
        chmod 600 "$registry_curl_config"
        registry_token_deadline=$((SECONDS + 240))
        manifest_url="https://ghcr.io/v2/bytehound-labs/bhtune/manifests/$image_tag"
        deadline=$((SECONDS + 2100))
        digest=''

        printf 'Waiting for %s:%s to appear in GHCR...\n' "$image_repo" "$image_tag"
        while (( SECONDS < deadline )); do
          if (( SECONDS >= registry_token_deadline )); then
            registry_token="$(curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:bytehound-labs/bhtune:pull" |
              jq -er '.token')"
            printf 'header = "%s: %s %s"\n' 'Authorization' 'Bearer' "$registry_token" \
              > "$registry_curl_config"
            chmod 600 "$registry_curl_config"
            registry_token_deadline=$((SECONDS + 240))
          fi
          headers="$(mktemp)"
          status="$(
            curl -sS --retry 2 --connect-timeout 10 --max-time 30 \
              -D "$headers" -o /dev/null -w '%{http_code}' \
              --config "$registry_curl_config" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "$manifest_url" || true
          )"
          digest="$(awk 'tolower($1) == "docker-content-digest:" { print $2; exit }' "$headers" | tr -d '\r')"
          rm -f "$headers"

          if [[ "$status" == '200' ]] &&
            printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            break
          fi

          printf 'GHCR response %s; image is not ready yet\n' "$status"
          sleep 10
        done

        if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
          printf 'error: timed out waiting for the immutable image tag %s\n' "$image_tag" >&2
          exit 1
        fi

        printf 'Resolved %s to %s\n' "$image_tag" "$digest"
        export GH_TOKEN="$BHTUNE_GITHUB_TOKEN"
        digest_without_prefix="$(printf '%s\n' "$digest" | sed 's/^sha256://')"
        attestation_json=''
        attestation_deadline=$((SECONDS + 600))
        attestation_error="$work_dir/attestation-error"
        while (( SECONDS < attestation_deadline )); do
          if "$gh_bin" attestation verify "oci://$image_repo@$digest" \
            --repo "$expected_repo" \
            --cert-identity "$expected_workflow" \
            --format json \
            >"$work_dir/attestation.json" 2>"$attestation_error"; then
            attestation_json="$(cat "$work_dir/attestation.json")"
            break
          fi

          if grep -Fq 'HTTP 404: Not Found' "$attestation_error"; then
            printf 'Image attestation is not ready yet; waiting...\n'
            sleep 10
            continue
          fi

          cat "$attestation_error" >&2
          printf 'error: image attestation verification failed\n' >&2
          exit 1
        done

        if [[ -z "$attestation_json" ]]; then
          printf 'error: timed out waiting for the image attestation for %s\n' "$digest" >&2
          exit 1
        fi

        if ! printf '%s\n' "$attestation_json" | jq -e \
          --arg image "$image_repo" \
          --arg digest "$digest_without_prefix" \
          --arg repo "$expected_repo" \
          --arg ref "$expected_ref" \
          --arg sha "$expected_sha" \
          --arg workflow "$expected_workflow" \
          'any(.[];
            (.verificationResult.signature.certificate.subjectAlternativeName == $workflow) and
            (.verificationResult.signature.certificate.githubWorkflowRepository == $repo) and
            (.verificationResult.signature.certificate.githubWorkflowRef == $ref) and
            (.verificationResult.signature.certificate.githubWorkflowSHA == $sha) and
            (.verificationResult.signature.certificate.sourceRepositoryURI == ("https://github.com/" + $repo)) and
            (.verificationResult.signature.certificate.sourceRepositoryRef == $ref) and
            (.verificationResult.signature.certificate.sourceRepositoryDigest == $sha) and
            (any(.verificationResult.statement.subject[]?;
              (.name == $image) and (.digest.sha256 == $digest)))
          )' >/dev/null; then
          printf 'error: image attestation does not match the expected repository, workflow, ref, commit, and digest\n' >&2
          exit 1
        fi

        printf '%s\n' "$BHTUNE_APP1_SSH_PRIVATE_KEY" > "$work_dir/id_ed25519"
        printf '%s\n' "$BHTUNE_APP1_KNOWN_HOSTS" > "$work_dir/known_hosts"
        chmod 600 "$work_dir/id_ed25519" "$work_dir/known_hosts"

        ssh -T \
          -i "$work_dir/id_ed25519" \
          -o IdentitiesOnly=yes \
          -o ConnectTimeout=30 \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="$work_dir/known_hosts" \
          -o BatchMode=yes \
          -o ForwardAgent=no \
          -o ClearAllForwardings=yes \
          mike@192.168.0.241 \
          /home/mike/git/FrontEnd/bhtune-demo/deploy.sh "$image_repo@$digest"
        SCRIPT

  notify:
    image: deblan/woodpecker-email
    settings:
      dsn:
        from_secret: EMAIL_DSN
      from:
        address:
          from_secret: EMAIL_FROM_ADDRESS
        name: "Woodpecker"
      recipients:
        from_secret: EMAIL_RECIPIENTS
      recipients_only: true
      content:
        subject: "{{ repo.full_name }} ({{ commit.branch }} - {{ commit.sha[0:8] }})"
        body: |
          {{ commit.sha }}<br>
          {{ pipeline.status }}<br>
          {{ commit.author_email }}<br>
    when:
      status: [failure]
