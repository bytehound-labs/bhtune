[workspace]
resolver = "2"
members = [
  "crates/bhtune-core",
  "crates/bhtune-driver",
  "crates/bhtune-db",
  "crates/bhtune-cli",
  "crates/bhtune-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Floor confirmed by direct test: `cargo check --workspace --all-targets --all-features
# --locked` fails under rustc 1.88 (sqlx 0.9.0 requires 1.94.0) and succeeds under 1.94.1.
# Re-verify with the same command whenever a dependency bump might raise this further.
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bytehound-labs/bhtune"
homepage = "https://github.com/bytehound-labs/bhtune"

# Pinned once here so every crate that needs a given dependency uses the same
# version workspace-wide. Populated as later phases add real dependencies;
# empty is a valid, intentional starting point for a scaffolding-only commit.
[workspace.dependencies]
# Internal workspace crates, each pinned to `path` + an explicit `version` requirement
# (mirroring opcda-bridge's own `opcda-bridge`/`opcda-bridge-proto` entries) rather than a
# bare `path`-only dependency. This is required, not stylistic: `cargo package` refuses to
# package any crate whose path dependency has no version requirement ("all dependencies
# must have a version requirement specified when packaging"), which would otherwise make
# every crate depending on another workspace member unpublishable. `bhtune-server` has no
# entry here since nothing in the workspace depends on it.
bhtune-core = { path = "crates/bhtune-core", version = "0.1.0" }
bhtune-driver = { path = "crates/bhtune-driver", version = "0.1.0" }
bhtune-db = { path = "crates/bhtune-db", version = "0.1.0" }
bhtune-cli = { path = "crates/bhtune-cli", version = "0.1.0" }
# Deliberately does NOT enable the "clock"/"now" features: bhtune-core must never be able
# to call `Utc::now()`, since the MRFT engine's determinism guarantee (see AGENTS.md) is
# that all timestamps come in as `Tick` data, never read from the wall clock internally.
# Disabling the feature at the Cargo level makes that a compile-time guarantee, not just a
# code-review convention.
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "alloc",
  "serde",
] }
# A single pin so `bhtune-db` and `bhtune-driver` (and any future crate needing fallible
# I/O) always agree on the same version — library-appropriate error handling (typed,
# matchable variants) as opposed to `anyhow`, which is reserved for binary crates that only
# need to propagate/print errors, never match on them.
thiserror = "2"
# `bhtune-core` parses the embedded DCS/PLC template catalog
# (`crates/bhtune-core/templates/builtin.toml`, `template-catalog`) and `bhtune-cli` parses
# `bhtune.toml`/the user template catalog (`cli-config`/`template-user-catalog`) -- promoted
# here once bhtune-core became a second consumer. Same major version `opcda-bridge` uses.
toml = "1"
# `bhtune-cli` has used this from the start; `bhtune-server` became a second consumer with
# `server-windows-service` (its `install`/`uninstall`/`start`/`stop`/`status` subcommands and
# `--config` flag) -- promoted here rather than duplicating the version pin. Only `derive` is
# common to both; `bhtune-cli`'s own `Cargo.toml` adds `env` on top, since `bhtune-server`'s
# handful of flags have no env-var-flag equivalents (matching `utoipa`'s `chrono`-on-top
# pattern below).
clap = { version = "4", features = ["derive"] }
# `bhtune-core` and `bhtune-db` derive `utoipa::ToSchema` behind an optional `utoipa`
# feature each (see their `Cargo.toml` comments), and `bhtune-server` derives the rest plus
# emits the OpenAPI document itself (`openapi-contract`) -- three consumers, pinned once so
# they can never disagree on the schema-format version. `default-features = false` because
# the only feature any of the three need is `macros` (the `ToSchema`/`IntoParams`/`OpenApi`/
# `#[utoipa::path]` derives, already the crate default) plus `chrono` (for `DateTime<Utc>`
# fields); `bhtune-server`'s own `Cargo.toml` adds `chrono` on top of this workspace entry.
utoipa = { version = "5", default-features = false, features = ["macros"] }
