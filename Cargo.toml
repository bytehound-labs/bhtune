[workspace]
resolver = "2"
members = [
  "crates/bhtune-core",
  "crates/bhtune-backend",
  "crates/bhtune-db",
  "crates/bhtune-cli",
  "crates/bhtune-desktop",
  "crates/bhtune-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bytehound-labs/bhtune"

# Pinned once here so every crate that needs a given dependency uses the same
# version workspace-wide. Populated as later phases add real dependencies;
# empty is a valid, intentional starting point for a scaffolding-only commit.
[workspace.dependencies]
# Deliberately does NOT enable the "clock"/"now" features: bhtune-core must never be able
# to call `Utc::now()`, since the MRFT engine's determinism guarantee (see AGENTS.md) is
# that all timestamps come in as `Tick` data, never read from the wall clock internally.
# Disabling the feature at the Cargo level makes that a compile-time guarantee, not just a
# code-review convention.
chrono = { version = "0.4", default-features = false, features = ["std", "alloc", "serde"] }
# A single pin so `bhtune-db` and `bhtune-backend` (and any future crate needing fallible
# I/O) always agree on the same version — library-appropriate error handling (typed,
# matchable variants) as opposed to `anyhow`, which is reserved for binary crates that only
# need to propagate/print errors, never match on them.
thiserror = "2"
