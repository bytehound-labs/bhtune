[package]
name = "bhtune-cli"
description = "Headless command-line adapter for BHTune: run MRFT tunes from scripts and schedulers with no GUI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "bhtune_cli"
path = "src/lib.rs"

[[bin]]
name = "bhtune"
path = "src/main.rs"

[dependencies]
bhtune-core = { path = "../bhtune-core" }
bhtune-backend = { path = "../bhtune-backend" }
bhtune-db = { path = "../bhtune-db" }
anyhow = "1"
chrono.workspace = true
# `derive` for the `Cli`/`Command` structs, `env` so flags like `--db`/`--bridge-host` can
# also be set via `BHTUNE_DB`/`BHTUNE_BRIDGE_HOST`; only this crate parses CLI args, so it
# stays local rather than promoted to `[workspace.dependencies]`, matching the project's
# single-consumer-dependency convention (see the root `Cargo.toml`).
clap = { version = "4", features = ["derive", "env"] }
# CSV export (`bhtune export`) generates its header row from the same `#[derive(Serialize)]`
# struct as its data rows, making the legacy app's MV/SV column-transposition bug (see
# AGENTS.md's bug register) structurally impossible to reintroduce.
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bhtune.toml` config file parsing (`cli-config`). Promoted to
# `[workspace.dependencies]` once `bhtune-core` became a second consumer (parsing the
# embedded DCS/PLC template catalog, `template-catalog`).
toml.workspace = true
# `rt-multi-thread`/`macros` to run as an async binary; `time` for the tune command's
# polling-interval ticker; `signal` for Ctrl+C-triggered graceful abort (the CLI's one
# concession to interactivity — see AGENTS.md's `cli-commands`/`cli-safety` scope split);
# `sync` for `crate::cancel`'s process-wide `tokio::sync::watch`-based Ctrl+C handle
# (`safety-cancellation`), listed explicitly here even though `test_support.rs` was already
# pulling `sync` in transitively via dev-dependency feature unification, so the real
# (non-test) binary's own dependency on it isn't left implicit.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
# Structured logging (`cli-logging`), matching `opcda-bridge-gateway`'s own `tracing`
# stack/versions/features exactly so both projects' logging conventions stay recognizable to
# the same user -- see `crate::logging`. Single-consumer within this workspace so far
# (`bhtune-core`/`-backend`/`-db`/`-server` have no `tracing` calls yet), so pinned directly
# here rather than promoted to `[workspace.dependencies]`, matching this crate's existing
# `clap`/`csv` convention; promote it if a second crate needs it.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
# Pinned to the same versions `opcda-bridge` (and `bhtune-backend`'s own tests) use, so the
# `opc` subcommand's tests can stand up a mock `Bridge` gRPC service and get wire-compatible
# generated types to test `OpcDaBackend`-backed commands end-to-end.
opcda-bridge-proto = "0.2"
tonic = "0.14"
tokio-stream = "0.1"
# Test-only: `tune.rs`'s tests implement `bhtune_backend::Backend` for a local in-memory mock
# to exercise the opcda-style mode-transition/restore/write-back logic (which the simulator
# backend's tag-less design never exercises) without a real gRPC gateway.
async-trait = "0.1"
# `test-util` (on top of the regular dependency's features, unified by Cargo for test
# builds only) so mode-transition/restore tests can run under `#[tokio::test(start_paused =
# true)]` and skip past the code's real `tokio::time::sleep(1000ms)` calls instantly, rather
# than making the test suite spend several real wall-clock seconds sleeping.
tokio = { version = "1", features = ["test-util"] }
# `tests/ctrlc_abort.rs` only: sends a real SIGINT to a spawned `bhtune` subprocess, which is
# the only way to genuinely exercise the Ctrl+C-triggered abort path (a real OS signal can't
# be delivered to one `#[test]` inside a shared multi-threaded `cargo test` binary without
# also hitting every other concurrently running test). Unix-only, matching the test's own
# `#[cfg(unix)]` gate; already present transitively (tokio/mio), so this just names the
# version directly rather than introducing a new dependency to the build graph.
libc = "0.2"
