[package]
name = "bhtune"
description = "Headless command-line adapter for BHTune: run MRFT tunes from scripts and schedulers with no GUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bhtune"
readme = "README.md"
keywords = ["command-line", "control-systems", "industrial", "pid", "tuning"]
categories = ["command-line-utilities"]
# Keep the package self-contained: the example code generator and its sample config are
# package content, while workspace-only integration tests and generated documentation are
# not.
include = [
  "Cargo.toml",
  "README.md",
  "bhtune.example.toml",
  "examples/**",
  "src/**",
]

[lints]
workspace = true

[lib]
name = "bhtune_cli"
path = "src/lib.rs"

[[bin]]
name = "bhtune"
path = "src/main.rs"

[dependencies]
bhtune-core.workspace = true
bhtune-driver.workspace = true
bhtune-db.workspace = true
bhtune-runtime.workspace = true
anyhow = "1"
chrono.workspace = true
# `derive` for the `Cli`/`Command` structs, `env` so flags like `--db`/`--bridge-host` can
# also be set via `BHTUNE_DB`/`BHTUNE_BRIDGE_HOST`; only this crate parses CLI args, so it
# stays local rather than promoted to `[workspace.dependencies]`, matching the project's
# single-consumer-dependency convention (see the root `Cargo.toml`).
clap = { workspace = true, features = ["env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bhtune.toml` config file parsing is owned by `bhtune-runtime`.
toml.workspace = true
# `rt-multi-thread`/`macros` for the async binary and tests; `fs` keeps async command
# handlers from blocking the executor during template and sample export file I/O.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
# CLI diagnostics share the runtime-configured subscriber with server and runtime events.
tracing.workspace = true
# Optional, feature-gated: exposes `schemars::JsonSchema` for the runtime-owned
# `config::BhtuneConfig` so `docs-generated-cli`'s `examples/gen_docs.rs` can emit a real JSON
# Schema for `bhtune.toml` instead of hand-written prose that silently drifts from the actual
# fields -- the same "generation can't drift, hand-written duplicates silently do" reasoning
# as `bhtune-core`'s `utoipa` feature (see that crate's `Cargo.toml`). A derive macro is compile-time-only, so
# gating it behind a feature (rather than the dependency being unconditional) keeps `schemars`
# out of the ordinary `bhtune`/`bhtune-server` release binaries entirely -- it is a docs-codegen
# concern, never a runtime one. Also forwards to `bhtune-core/schemars` and
# `bhtune-runtime/schemars` so one invocation schemas `DcsTemplate` and runtime configuration.
schemars = { version = "1", optional = true, features = ["derive"] }

[features]
schemars = ["dep:schemars", "bhtune-core/schemars", "bhtune-runtime/schemars"]

[[example]]
name = "gen_docs"
required-features = ["schemars"]

[dev-dependencies]
proptest.workspace = true
tempfile = "3"
# Test-only: `template.rs`'s "delete a template still referenced by a loop" test inserts a
# raw `loops` row directly via SQL to trigger that FK restriction -- there is no
# `LoopRow::insert` in `bhtune-db` yet (loop-saving lands with `cli-commands`), so this
# mirrors the exact same raw-row pattern `bhtune-db`'s own `tests/schema.rs` already uses to
# test the identical constraint. Not a production dependency: this crate's non-test code
# never touches `sqlx` directly, going through `bhtune-db`'s repository API instead.
sqlx = { version = "0.9", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "chrono",
] }
# Tests still construct generated browse/read/write messages. The mock `Bridge` service
# itself comes from `bhtune-test-support`, pinned to the same proto/tonic versions.
# Versionless path only: Cargo strips a versionless dev-dependency when packaging, so
# this unpublished crate is never resolved from crates.io. Do not add a version.
opcda-bridge-proto = "0.6"
bhtune-test-support = { path = "../bhtune-test-support", features = [
  "mock-driver",
] }
# Test-only: `tune.rs`'s tests implement `bhtune_driver::Driver` for a local in-memory mock
# to exercise the opcda-style mode-transition/restore/write-back logic (which the simulator
# driver's tag-less design never exercises) without a real gRPC gateway.
async-trait = "0.1"
# `test-util` (on top of the regular dependency's features, unified by Cargo for test
# builds only) so mode-transition/restore tests can run under `#[tokio::test(start_paused =
# true)]` and skip past the code's real `tokio::time::sleep(1000ms)` calls instantly, rather
# than making the test suite spend several real wall-clock seconds sleeping.
tokio = { version = "1", features = ["test-util"] }
# `tests/ctrlc_abort.rs` only: sends a real SIGINT to a spawned `bhtune` subprocess, which is
# the only way to genuinely exercise the Ctrl+C-triggered abort path (a real OS signal can't
# be delivered to one `#[test]` inside a shared multi-threaded `cargo test` binary without
# also hitting every other concurrently running test). Unix-only, matching the test's own
# `#[cfg(unix)]` gate; already present transitively (tokio/mio), so this just names the
# version directly rather than introducing a new dependency to the build graph.
libc = "0.2"
# `examples/gen_docs.rs` only (`docs-generated-cli`): regenerates `docs/reference/cli.md`,
# man pages under `man/`, and shell completions under `completions/` from the same `Cli`/
# `Command` clap definitions every real invocation of `bhtune` already parses against, so
# these can never drift the way hand-written usage docs would. Dev-dependencies rather than
# regular ones since nothing at runtime in the shipped `bhtune` binary needs to *generate*
# its own docs -- only `cargo run -p bhtune --example gen_docs` does.
clap-markdown = "0.1.5"
clap_mangen = "0.3.3"
clap_complete = "4.6.9"

# `cargo-binstall` metadata (`pkg-eval-binstall`). Inert today -- `bhtune` isn't on
# crates.io yet (`release-plz.toml` has `publish = false` workspace-wide pending
# `release-v1`) -- but ready the moment it is, since binstall only reads this from a
# manifest it already fetched, needing no separate opt-in step. Only added to this crate,
# not `bhtune-server` (which has its own `publish = false` and is shipped with the CLI in
# the platform release archives rather than as a separately published crate).
#
# `{ version }` is always the bare crate version with no `v` prefix (binstall has no `{
# tag }` variable), so the literal `v` before every `{ version }` below is required to
# match this project's own `v`-prefixed release tags (`release.yml`'s trigger pattern and
# `taiki-e/create-gh-release-action`'s tag naming) -- exactly the pattern binstall's own
# docs show for this same situation.
#
# `bin-dir` is flat (`{ bin }{ binary-ext }`, no subdirectory) because
# `taiki-e/upload-rust-binary-action`'s `leading-dir` input defaults to `false` --
# confirmed in its README -- so `release.yml`'s archives place binaries at the archive
# root, not nested in a `bhtune-$tag-$target/` directory the way binstall's own *default*
# (unconfigured) path assumes.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/bhtune-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# `release.yml`'s `upload-rust-binary-action` uses its own `zip: windows` default (unix
# targets stay `tar`/`tgz`), so only the Windows target needs a format override here.
[package.metadata.binstall.overrides.'cfg(windows)']
pkg-fmt = "zip"
