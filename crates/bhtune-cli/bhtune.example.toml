# Example configuration for the bhtune CLI.
#
# Copy this file to one of the locations below (or pass a path explicitly
# with --config) to have it picked up automatically. Every key is
# optional — anything left out (or the whole file, if it doesn't exist)
# falls back to its environment variable or built-in default.
#
# Precedence for settings with CLI/environment overrides: CLI flag > environment
# variable > config file > built-in default. Global tune timing and safety
# settings use this file or their built-in defaults; they are not per-run flags.
#
# Default file locations (first one found wins):
#   Linux/macOS: $XDG_CONFIG_HOME/bhtune/bhtune.toml
#                (falls back to $HOME/.config/bhtune/bhtune.toml)
#   Windows:     %APPDATA%\bhtune\bhtune.toml

# Server exposure mode: "full" keeps the complete live-plant API; "demo" exposes only
# the restricted public simulator workflow. The environment variable
# BHTUNE_SERVER_MODE takes precedence.
server_mode = "full"

# Exact browser origin allowed for state-changing requests. BHTUNE_ORIGIN takes precedence.
# Demo mode requires HTTPS, except that explicit localhost/loopback HTTP origins are accepted
# for local tests and development. An origin contains only a scheme, host, and optional port.
# origin = "https://bhtunedemo.example.com"

# Optional reverse-proxy address trusted to supply X-BHTune-Client-IP for Demo quotas. Use one
# exact IPv4/IPv6 address or a matching-family CIDR (for example, "10.0.0.0/24"). The proxy
# must replace that header with one IP address; forwarding chains and duplicate values are
# rejected. Leave this unset when clients connect directly.
# trusted_proxy = "127.0.0.1"

# SQLite database path. Relative paths are resolved against the current
# working directory when the process starts. Missing parent directories
# are created automatically.
# CLI flag: --db
# Env var: BHTUNE_DB
# Default:
#   Linux/macOS: $XDG_DATA_HOME/bhtune/bhtune.db
#                (falls back to $HOME/.local/share/bhtune/bhtune.db)
#   Windows:     %APPDATA%\bhtune\bhtune.db
db = "/var/lib/bhtune/bhtune.db"

# opcda-bridge gateway address `tune --driver opcda` and the `opc`
# subcommands connect to, used when --bridge-host is omitted.
# CLI flag: --bridge-host
# Env var: BHTUNE_BRIDGE_HOST
# Default: localhost:7600
bridge_host = "localhost:7600"

# Default OPC DA server ProgID for `tune --driver opcda` and the `opc`
# subcommands, used when --server is omitted. Unlike the other keys, there
# is no built-in default — if this is unset and --server is omitted, the
# command errors.
# CLI flag: --server
server = "Kepware.KepServerEX.V5"

# Global OPC sample-quality policy. Uncertain readings are accepted by default;
# set this to false to reject them for tuning-critical operations. Bad readings
# are always rejected.
allow_uncertain_quality = true

# Optional automatic history retention. Omit this key to retain runs forever;
# when present, it must be a positive whole number of days.
retention_days = 30

# Public Demo policy. Every key is optional, but any key that is present must use the
# exact approved value shown here. These limits cannot be widened or otherwise overridden
# by deployment configuration.
[demo]
# Anonymous visitor-session lifetime.
session_ttl_secs = 86400
# Simulator tune timing. Demo uses a fixed 200 ms poll interval.
poll_interval_ms = 200
run_timeout_secs = 30
# Active tune limits.
max_active_runs_global = 8
max_active_runs_per_visitor = 1
# Accepted tune-start quotas. Ordinary API reads do not consume these quotas.
accepted_starts_per_token = 6
accepted_starts_per_client_ip = 6
accepted_start_window_secs = 600
# History limits.
retained_runs_per_visitor = 10
max_tune_run_rows_global = 5000
# HTTP and streaming limits.
max_json_body_bytes = 32768
max_sse_per_visitor = 2
max_sse_global = 32
sse_lifetime_secs = 45
ordinary_request_concurrency = 64
ordinary_request_timeout_secs = 10
# Expired-session and excess-history cleanup cadence.
cleanup_interval_secs = 300

# Global MRFT timing and safety settings. These values apply to future tunes;
# an already prepared or running tune keeps the values it captured at start.
# Omit the whole [tuning] table or any key to use that key's built-in default.
# The Configuration page can edit or reset this section.
[tuning]
# Pre/post-test recording padding, in seconds. Valid range: 0..=3600.
mrft_delay_secs = 0
# Driver polling interval, in milliseconds. Must be at least 1.
poll_interval_ms = 800
# Whole-run wall-clock timeout, in seconds. Must be at least 1.
timeout_secs = 3600
# Maximum duration of one driver read/write, in seconds. Must be at least 1.
op_timeout_secs = 30
# Maximum duration of post-run restoration, in seconds. Must be at least 1.
# OPC DA tunes require at least 4 seconds for MV actuation confirmation.
restore_timeout_secs = 30

# Structured logging. Every key here is optional and falls back to its own
# CLI flag / built-in default independently -- e.g. you can set only
# log.format here and still pass --log-level on the command line. Logs
# never go to stdout (that stream is reserved for --output json); they
# always go to the rotating file below, and additionally mirror to stderr
# only when an actual console is attached.
[log]
# Log level / directive spec, e.g. "info" or "bhtune_cli=debug,sqlx=warn".
# CLI flag: --log-level
# Env var: RUST_LOG
# Default: info
level = "info"

# Directory to write log files to.
# CLI flag: --log-dir
# Default:
#   Linux/macOS: $XDG_DATA_HOME/bhtune/logs
#                (falls back to $HOME/.local/share/bhtune/logs)
#   Windows:     %APPDATA%\bhtune\logs
dir = "/var/log/bhtune"

# Log file format: "pretty" (human-readable, default) or "json"
# (newline-delimited, for log shippers).
# CLI flag: --log-format
# Default: pretty
format = "pretty"

# Log file rotation: "hourly", "daily" (default), or "never".
# CLI flag: --log-rotation
# Default: daily
rotation = "daily"
