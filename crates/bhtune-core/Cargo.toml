[package]
name = "bhtune-core"
description = "Pure domain logic for BHTune: the MRFT tuning state machine, PID math, and data model. No I/O, no async, no clock reads — see AGENTS.md."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono.workspace = true
serde = { version = "1", features = ["derive"] }
# Parses the embedded DCS/PLC template catalog (`crates/bhtune-core/templates/builtin.toml`,
# `template-catalog`) via `toml::from_str` on an `include_str!`-embedded `&'static str` --
# not I/O, so this doesn't violate this crate's "no I/O" rule (see the description above);
# all real file reading (the user catalog, imports) stays in bhtune-cli.
toml.workspace = true
# Optional, feature-gated: derives `utoipa::ToSchema` on the types `bhtune-server`'s HTTP
# DTOs embed directly (enums like `ProcessType`, and structs like `LoopConfig`/`DcsTemplate`/
# `Tick`/`MrftState`), so their OpenAPI schema (`openapi-contract`) is generated from the
# real type instead of hand-duplicated -- the exact same "generation can't drift, hand-
# written duplicates silently do" reasoning AGENTS.md's "Documentation system" section
# applies to the CLI reference/man pages. A `derive` macro is compile-time-only and has no
# runtime behavior, so enabling it doesn't add any I/O/async/clock capability to this crate
# -- see the crate doc comment in `lib.rs`. Off by default (`cargo build -p bhtune-core`
# alone never touches `utoipa`); `bhtune-server` is the only crate that enables it, and only
# because it and `bhtune-db` are both in the same workspace build, `bhtune-core` itself
# doesn't need to (and doesn't) depend on `bhtune-db`.
utoipa = { workspace = true, optional = true, features = ["chrono"] }
# Optional, feature-gated, same rationale as `utoipa` immediately above: derives
# `schemars::JsonSchema` on `DcsTemplate` (and the types it embeds) so `bhtune-cli`'s
# `docs-generated-cli` codegen (`examples/gen_docs.rs`) can emit a real JSON Schema for the
# DCS/PLC template catalog shape instead of hand-written prose that silently drifts. Off by
# default; only `bhtune-cli`'s `schemars` feature enables it (`bhtune-core/schemars`).
schemars = { version = "1", optional = true, features = ["derive"] }

[features]
utoipa = ["dep:utoipa"]
schemars = ["dep:schemars"]

[dev-dependencies]
serde_json = "1"
