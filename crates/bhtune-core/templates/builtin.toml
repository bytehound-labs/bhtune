revert_mode = true
proportional_type = "gain"
integral_type = "reset_time"
integral_unit = "minutes"
derivative_type = "derivative_time"
derivative_unit = "minutes"
process_variable_suffix = "Inp_PV"
manipulated_variable_suffix = "PSet_SP"
setpoint_variable_suffix = "PSet_CV"
controller_direction_suffix = "Cfg_CtrlAction"
controller_mode_suffix = "Inp_OvrdCmd"
mode_attribute_suffix = ""
upper_pv_range_suffix = "Val_PVEUMax"
lower_pv_range_suffix = "Val_PVEUMin"
upper_mv_range_suffix = "Val_CVEUMax"
lower_mv_range_suffix = "Val_CVEUMin"
proportional_constant_suffix = "Cfg_PGain"
integral_constant_suffix = "Cfg_IGain"
derivative_constant_suffix = "Cfg_DGain"
