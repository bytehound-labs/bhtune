description = "Allen-Bradley PlantPAx Library of Process Objects P_PIDE instruction: Inp_/Cfg_/Val_/PSet_ prefixed tags."
source = "PlantPAx Library of Process Objects P_PIDE instruction reference, cross-checked against a live PlantPAx deployment."
