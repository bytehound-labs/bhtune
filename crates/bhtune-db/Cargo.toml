[package]
name = "bhtune-db"
description = "SQLite persistence (sqlx, WAL mode) for BHTune: DCS/PLC templates, loops, tune runs, samples, and results. A single, un-encrypted, open database file."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bhtune-core.workspace = true
chrono.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
# Only bhtune-db needs sqlx today, so — matching the existing convention of
# keeping single-consumer dependencies local rather than in
# `[workspace.dependencies]` (see the root `Cargo.toml`) — it's pinned here,
# not promoted to the workspace level. "macros" is only for the
# compile-time `sqlx::migrate!` path-embedding macro (it just reads the
# `migrations/` directory at build time); this crate deliberately does not
# use the `query!`/`query_as!` compile-time-checked-SQL macros, which would
# require either a live database or a committed `.sqlx` offline cache at
# build time — plain `sqlx::query`/`query_as` keeps `cargo build`/`cargo
# test` working with zero extra setup for every contributor.
# The "sqlite" feature enables "sqlite-bundled" by default, which statically
# compiles SQLite from vendored source (`libsqlite3-sys/bundled`) rather
# than linking a system SQLite. Deliberate: the release build matrix
# already spans Linux/macOS/Windows (`build-matrix`), and requiring a
# system `libsqlite3-dev`-equivalent on every one of those, for every
# contributor and CI runner, is exactly the kind of environment-specific
# setup friction this project avoids elsewhere (see AGENTS.md's "Zero
# Windows/COM dependency" reasoning). No direct `libsqlite3-sys` dependency
# is needed to get this — it would only be required to opt into
# `sqlite-unbundled` instead.
sqlx = { version = "0.9", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "chrono",
  "migrate",
  "macros",
] }
# Optional, feature-gated: derives `utoipa::ToSchema` on this crate's plain lifecycle enums
# (`TemplateOrigin`, `TuneDriver`, `TuneOutcome`, `RestoreStatus`, `SampleQuality`,
# `RollbackState`, `WriteKind`) so `bhtune-server`'s OpenAPI spec (`openapi-contract`)
# describes them from the real type. Same rationale as `bhtune-core`'s identical optional
# dependency -- see that crate's `Cargo.toml` comment; off by default, so `bhtune-cli` (which
# depends on this crate but never touches HTTP) never pulls `utoipa` in.
utoipa = { workspace = true, optional = true }

[features]
utoipa = ["dep:utoipa"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
