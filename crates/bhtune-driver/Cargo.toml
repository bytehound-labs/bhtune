[package]
name = "bhtune-driver"
description = "The Driver trait (tag read/write/browse) and its implementations: OPC DA (via opcda-bridge), an in-process FOPDT simulator, and a golden-trace replay driver for testing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bhtune-driver"
readme = "README.md"
keywords = ["control-systems", "industrial", "opc-da", "pid", "simulation"]
categories = ["simulation"]
# Keep the registry archive to the crate source and its package documentation; the
# replay tests use golden fixtures owned by the workspace.
include = ["Cargo.toml", "README.md", "src/**"]

[lints]
workspace = true

[dependencies]
chrono.workspace = true
thiserror.workspace = true
# `Driver` and the runtime's audited wrapper need async, object-safe methods so adapters can
# share implementations behind `Box<dyn Driver>`/`Arc<dyn Driver>`. Native async trait methods
# are not dyn-compatible, so both crates use the workspace's async-trait dependency.
async-trait.workspace = true
# `OpcDaDriver` is the only thing that talks to the bridge directly -- everything else goes
# through the `Driver` trait instead -- so this stays local rather than promoted to
# `[workspace.dependencies]`.
opcda-bridge = "0.6"
tonic = "0.14"
# Needed for `tokio::sync::Mutex`: `opcda_bridge::Client`'s methods take `&mut self` (it
# buffers per-call gRPC codec state), but `Driver`'s methods take `&self` (required so a
# driver can be shared behind `Arc<dyn Driver>`), so `OpcDaDriver` serializes access to
# its one `Client` through an async-aware mutex. Unlike `std::sync::MutexGuard`,
# `tokio::sync::MutexGuard` is `Send`, so it can be held across the `.await` points inside
# each trait method without breaking `#[async_trait]`'s default requirement that its
# generated futures be `Send`.
tokio = { version = "1", features = ["sync"] }
# Only `SimulatorDriver`'s measurement-noise model needs randomness, so this stays local
# rather than promoted to `[workspace.dependencies]`. `default-features = false`
# drops `thread_rng`/`sys_rng`/OS-entropy machinery this crate never uses -- every RNG here
# is explicitly seeded (see `FopdtProcess::new`) for reproducible simulation runs.
rand = { version = "0.10", default-features = false, features = [
  "std",
  "std_rng",
] }
# Only `ReplayDriver::from_fixture_json` needs to parse a golden-master trace's JSON, so
# these stay local rather than promoted to `[workspace.dependencies]`, matching the
# single-consumer convention already used for `async-trait`/`opcda-bridge`/`rand` above.
# Same version pins `bhtune-core`/`bhtune-db` already use.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest.workspace = true
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "time",
] }
# Only for `simulator`'s end-to-end test proving a real `MrftEngine` completes a relay test
# against `SimulatorDriver` through the actual `Driver` trait -- everywhere else in this
# crate stays `bhtune-core`-free (see `driver-trait`'s design notes in `AGENTS.md`).
bhtune-core.workspace = true
# Smoke tests construct generated browse/read/search messages. The mock `Bridge` service
# lives in `bhtune-test-support` and is not enabled with `mock-driver`, which would cycle
# back through this crate. The proto pin stays so those messages match the client stub.
# Versionless path only: Cargo strips a versionless dev-dependency when packaging, so
# this unpublished crate is never resolved from crates.io. Do not add a version.
opcda-bridge-proto = "0.6"
bhtune-test-support = { path = "../bhtune-test-support" }
