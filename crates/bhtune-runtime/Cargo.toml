[package]
name = "bhtune-runtime"
description = "Shared BHTune application runtime for the CLI and HTTP adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/bhtune-runtime"
readme = "README.md"
keywords = ["control-systems", "industrial", "pid", "runtime", "tuning"]
categories = ["api-bindings"]
include = ["Cargo.toml", "README.md", "src/**"]

[lints]
workspace = true

[features]
schemars = ["dep:schemars", "bhtune-core/schemars"]

[dependencies]
bhtune-core.workspace = true
bhtune-db.workspace = true
bhtune-driver.workspace = true
anyhow = "1"
async-trait.workspace = true
chrono.workspace = true
csv = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
toml.workspace = true
toml_edit = "0.22"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "signal",
  "sync",
  "fs",
] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender.workspace = true
schemars = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
async-trait = "0.1"
proptest.workspace = true
tempfile = "3"
sqlx = { version = "0.9", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "chrono",
] }
opcda-bridge-proto = "0.5"
bhtune-test-support = { path = "../bhtune-test-support", features = [
  "mock-driver",
] }
tokio = { version = "1", features = ["test-util"] }
tonic.workspace = true
