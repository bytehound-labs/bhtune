[package]
name = "bhtune-server"
description = "Axum HTTP/REST adapter for BHTune: the primary v1 GUI backend, serving the tuning engine and the embedded React SPA from one binary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "bhtune_server"
path = "src/lib.rs"

[dependencies]
# `features = ["utoipa"]` derives `utoipa::ToSchema` on the types this crate's DTOs embed
# directly (`ProcessType`, `ControllerType`, `ControllerDirection`, `ResponseLevel`,
# `LoopConfig`, `DcsTemplate`, `Tick`, `MrftState`) -- see that crate's `Cargo.toml` comment
# for why the dependency is optional there but always-on here.
bhtune-core = { workspace = true, features = ["utoipa"] }
bhtune-db = { workspace = true, features = ["utoipa"] }
# Reuses the CLI's config precedence (`bhtune.toml`/env var/default resolution -- including
# the `bind` address this crate alone consumes, see `crate::config::resolve_bind_addr`),
# database open/migrate/seed bootstrap, and tracing setup verbatim, rather than duplicating
# or re-deriving any of it. This is a deliberate, and deliberately named, temporary coupling
# -- see "Key architectural decisions" in AGENTS.md: `bhtune-cli` and `bhtune-server` are
# meant to be peer adapters over `bhtune-core`/`bhtune-db`/`bhtune-driver`, not one
# depending on the other, but extracting the shared pieces (`config.rs`/`db.rs`/`logging.rs`,
# none of which touch `clap`) into their own crate is a refactor with no payoff until a
# second reason to do it shows up. Revisit if this coupling ever becomes awkward (e.g. the
# two crates' config needs diverge, or `bhtune-cli`'s `clap`/`csv` dependencies become a real
# concern in this binary's footprint).
bhtune-cli.workspace = true
# `routes::runs`'s `write_run`/`revert_run` (`api-post-run-write`) connect an `OpcDaDriver`
# directly, the same way `bhtune-cli`'s own `commands::history::revert` does, rather than
# going through `bhtune_cli::driver::build` (which is shaped around a full `TuneArgs`, not a
# post-hoc write against a run's already-recorded connection). This is the first direct
# `bhtune-server` -> `bhtune-driver` edge, matching the "peer adapters over
# bhtune-core/bhtune-db/bhtune-driver" architecture described above -- the temporary
# `bhtune-cli` coupling is for config/db/logging reuse, not because `bhtune-driver` itself is
# off limits.
bhtune-driver.workspace = true
anyhow = "1"
chrono.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same major version already in the workspace's dependency graph via `bhtune-driver`'s
# `tonic`/`tower` stack (see `cargo deny check`'s duplicate-version lints), so this doesn't
# add a second `axum` build to the tree.
axum = "0.8"
# `routes::stream`'s `GET /api/runs/{id}/stream` (`frontend-live-stream`): lets the poll-and-
# yield loop be written as a plain imperative `async fn` body instead of hand-rolling a
# `Stream::poll_next` state machine or threading state through `futures::stream::unfold`. Its
# own dependency, `futures-core`, is already in the workspace's build graph (transitively, via
# `sqlx`/`tonic`) so this doesn't add a new crate to the tree, only a new direct edge to one
# already present.
async-stream = "0.3"
# `spa.rs` (`server-embed-spa`): embeds the built React SPA (`frontend/dist/`) into the
# binary. Kept local rather than promoted to `[workspace.dependencies]` -- this is the only
# crate that will ever serve a browser UI. `interpolate-folder-path` anchors the `#[folder]`
# path at `$CARGO_MANIFEST_DIR` rather than the process's current working directory, so a
# service manager (systemd, the eventual Windows Service) starting the binary from an
# arbitrary directory still finds the assets -- verified empirically (a debug build run from
# an unrelated directory still located its embedded folder). `mime-guess` gives
# `EmbeddedFile::metadata.mimetype()` the correct `Content-Type` per file without a separate
# direct `mime_guess` dependency. `deterministic-timestamps` zeroes embedded files' mtimes so
# release builds stay byte-reproducible across CI runners (`build-matrix`). Deliberately
# *not* using `debug-embed`: without it, a plain `cargo build`/`cargo run` (debug) reads
# `frontend/dist/` live off disk on every request, so a rebuilt frontend shows up without
# recompiling Rust -- only `--release` (used by `build-matrix`/the Windows installer)
# actually embeds the bytes into the binary, which is the only build type that ships without
# the source tree alongside it.
rust-embed = { version = "8", features = [
  "interpolate-folder-path",
  "mime-guess",
  "deterministic-timestamps",
] }
# `rt-multi-thread`/`macros` to run as an async binary; `signal` for graceful shutdown on
# Ctrl+C/SIGTERM, matching `bhtune-cli`'s own Ctrl+C handling story (see `cancel.rs`) rather
# than leaving a request in flight when the process is asked to stop. `sync` for
# `tokio::sync::Mutex` in `active_run.rs`, guarding the single-in-flight-run registry across
# the `.await` points `POST /api/runs`'s handler needs while it holds the lock.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "net",
  "sync",
] }
# `openapi-contract`: derives the OpenAPI 3.1 document (`#[derive(utoipa::OpenApi)]`,
# `#[derive(utoipa::ToSchema)]`/`IntoParams` on local DTOs, `#[utoipa::path]` on handlers)
# from the same route/DTO code that serves the API, so the spec cannot silently drift from
# the real routes -- see `crate::openapi`. `chrono` on top of the workspace entry's
# `macros`-only default, for the same `DateTime<Utc>` reason `bhtune-core`'s identical
# dependency needs it (see that crate's `Cargo.toml` comment).
utoipa = { workspace = true, features = ["chrono"] }
# Renders the always-current OpenAPI document as an interactive Scalar UI at `/api/docs` --
# no separate static-file build step, no JS toolchain, and (unlike Swagger UI) no bundled
# `swagger-ui-*.zip` binary blob to keep in sync with a released version.
utoipa-scalar = { version = "0.3", features = ["axum"] }
tracing = "0.1"
# Only used to name `WorkerGuard`'s type directly (`run.rs`'s `BoundServer::log_guard` field)
# -- `bhtune_cli::logging::init_tracing`'s actual return value already comes from this same
# dependency in `bhtune-cli`'s own `Cargo.toml` (same version pinned there), so this doesn't
# add a second copy of the crate to the build graph.
tracing-appender = "0.2"
# `cli.rs`'s `Cli`/`ServiceCommand` (`server-windows-service`): a `--config` flag plus the
# `install`/`uninstall`/`start`/`stop`/`status` subcommands that manage the platform service.
# Second consumer of the workspace pin (`bhtune-cli` is the first) -- see that entry's
# comment in the root `Cargo.toml`. No `env` feature needed here: unlike `bhtune-cli`'s
# flags, nothing on this binary's small surface has an env-var equivalent.
clap.workspace = true

# Windows Service Control Manager (SCM) integration (`server-windows-service`), kept as a
# target-specific (not workspace-level) dependency since no other crate will ever touch it --
# matching `rust-embed`/`utoipa-scalar` above. Same version opcda-bridge-gateway already
# depends on and has cleared this project's `cargo deny check` license gate with, for the
# same reason: one FOSS crate wrapping the `windows-sys` SCM bindings rather than hand-rolling
# unsafe FFI against `advapi32.dll` in this crate directly.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
tempfile = "3"
# Test-only: `routes/history.rs`'s fuller fixture inserts a raw `loops` row directly via SQL
# so a seeded run can carry a real `loop_id` for the `GET /api/runs?loop_id=` filter test --
# there is no `LoopRow::insert` in `bhtune-db` yet (loop-saving lands with `cli-commands`), so
# this mirrors the exact same raw-row pattern `bhtune-db`'s own `tests/schema.rs` and
# `bhtune-cli`'s `template.rs` tests already use for the identical need. Not a production
# dependency: this crate's non-test code never touches `sqlx` directly, going through
# `bhtune-db`'s repository API instead.
sqlx = { version = "0.9", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "chrono",
] }
# `tower::ServiceExt::oneshot` drives the router directly against an in-memory request/
# response pair, so route tests never need a real bound TCP socket.
tower = { version = "0.5", features = ["util"] }
# Reads a response's body bytes out in tests (`axum::body::Body` implements `http_body::Body`
# but has no built-in "collect to bytes" convenience of its own).
http-body-util = "0.1"
# `tests/graceful_shutdown.rs`: bounds how long it waits for the spawned subprocess to print
# its "listening" line and to exit after being signalled (on top of the regular dependency's
# `net`/`signal`/`macros`/`rt-multi-thread` features, unified by Cargo for test builds only).
# `test-util` (`routes/opc.rs`'s `with_timeout` unit tests): `#[tokio::test(start_paused =
# true)]` + `std::future::pending()` exercises the real 30-second `OPC_QUERY_TIMEOUT_SECS`
# deadline in virtual rather than real time -- same rationale as `bhtune-cli`'s identical
# dev-dependency (see that crate's `Cargo.toml` comment).
tokio = { version = "1", features = ["time", "test-util"] }
# `tests/graceful_shutdown.rs` only: sends a real SIGTERM/SIGINT to a spawned `bhtune-server`
# subprocess, mirroring `bhtune-cli`'s own `tests/ctrlc_abort.rs` rationale -- a real OS
# signal can't be delivered to one `#[test]` inside a shared multi-threaded `cargo test`
# binary without also hitting every other concurrently running test. Unix-only, matching the
# test's own `#[cfg(unix)]` gate; already present transitively (tokio/mio), so this just names
# the version directly rather than introducing a new dependency to the build graph.
libc = "0.2"
# `routes/runs.rs`'s `write_run`/`revert_run` tests (`api-post-run-write`) stand up a
# minimal mock `Bridge` gRPC service to prove the two new handlers actually complete a real
# `OpcDaDriver` connect-write-verify round trip, mirroring `bhtune-driver::opcda`'s own
# `smoke_tests` module. Pinned to the exact same versions that module (and `opcda-bridge`
# itself) use, for the same reason: the mock service's generated `tonic`/`prost` types must
# agree on the wire format with `opcda_bridge::Client`'s generated stub on the other end.
opcda-bridge-proto = "0.2"
tonic = "0.14"
tokio-stream = "0.1"

[[bin]]
name = "bhtune-server"
path = "src/main.rs"
