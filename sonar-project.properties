sonar.organization=bytehound-labs
sonar.projectKey=bytehound-labs_bhtune
sonar.projectName=BHTune
sonar.sourceEncoding=UTF-8

sonar.sources=crates,frontend/src,website,scripts
sonar.tests=frontend/e2e
sonar.test.inclusions=frontend/e2e/**/*.ts,frontend/e2e/**/*.mjs

sonar.exclusions=**/target/**,**/node_modules/**,frontend/dist/**,website/build/**,frontend/src/api/schema.d.ts,openapi.json,docs/**,man/**,completions/**,crates/**/tests/**,crates/**/benches/**,fuzz/**
sonar.coverage.exclusions=frontend/**,website/**,scripts/**,**/tests/**,**/benches/**
sonar.rust.lcov.reportPaths=lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# SQLite DDL has no reusable constants for independent CHECK constraints and
# trigger predicates. These repeated enum literals are intentional schema
# definitions, and the PL/SQL string-literal rule is not actionable here.
sonar.issue.ignore.multicriteria=sqlite_schema_literals
sonar.issue.ignore.multicriteria.sqlite_schema_literals.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.sqlite_schema_literals.resourceKey=crates/bhtune-db/migrations/0001_initial_schema.sql
